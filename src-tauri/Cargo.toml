[package]
name = "tinkerterm"
version = "0.1.0"
edition = "2021"

[lib]
name = "tinkerterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "copy-dylibs", "tls-native", "api-23"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3", features = ["NSWindow", "NSButton", "NSControl", "NSView", "NSResponder", "NSAnimationContext", "NSAnimation"] }
objc2 = "0.6"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["coreml"] }

# dependencies (ort, ndarray) optimized even in dev: unoptimized tensor code would slow the voice
[profile.dev.package."*"]
opt-level = 3
